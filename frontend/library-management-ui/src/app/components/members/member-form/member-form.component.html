<div class="page">
  <div class="page-header"><h2>{{ isEdit ? 'Edit Member' : 'New Member' }}</h2></div>
  <app-toast [toasts]="toastMessages" (dismiss)="onDismissToast($event)"></app-toast>
  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="loading" *ngIf="loading"><app-spinner [loading]="true"></app-spinner><p>Loading member...</p></div>
  <form *ngIf="!loading && !submitting" (ngSubmit)="onSubmit()" #memberForm="ngForm" class="form">
    <div class="form-group">
      <label for="membershipNumber">Membership Number *</label>
      <input type="text" id="membershipNumber" [(ngModel)]="form.membershipNumber" name="membershipNumber" required #mnInput="ngModel">
      <span class="field-error" *ngIf="errors['membershipNumber']">{{ errors['membershipNumber'] }}</span>
    </div>
    <div class="form-group">
      <label for="userId">User ID *</label>
      <input type="text" id="userId" [(ngModel)]="form.userId" name="userId" required>
    </div>
    <div class="form-group">
      <label for="address">Address *</label>
      <textarea id="address" [(ngModel)]="form.address" name="address" required rows="3" #addrInput="ngModel"></textarea>
      <span class="field-error" *ngIf="errors['address']">{{ errors['address'] }}</span>
    </div>
    <div class="form-group">
      <label for="phoneNumber">Phone</label>
      <input type="text" id="phoneNumber" [(ngModel)]="form.phoneNumber" name="phoneNumber">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="submitting">{{ submitting ? 'Saving...' : (isEdit ? 'Update' : 'Create') }}</button>
      <button type="button" class="btn btn-cancel" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
