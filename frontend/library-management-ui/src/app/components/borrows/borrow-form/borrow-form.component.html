<div class="page">
  <div class="page-header"><h2>New Borrow</h2></div>
  <app-toast [toasts]="toastMessages" (dismiss)="onDismissToast($event)"></app-toast>
  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  <form *ngIf="!submitting" (ngSubmit)="onSubmit()" #borrowForm="ngForm" class="form">
    <div class="form-group">
      <label for="bookCopyId">Book Copy ID *</label>
      <input type="text" id="bookCopyId" [(ngModel)]="form.bookCopyId" name="bookCopyId" required #bcInput="ngModel">
      <span class="field-error" *ngIf="errors['bookCopyId']">{{ errors['bookCopyId'] }}</span>
    </div>
    <div class="form-group">
      <label for="memberId">Member ID *</label>
      <input
        type="text"
        id="memberId"
        [(ngModel)]="form.memberId"
        name="memberId"
        required
        #mInput="ngModel"
        [readonly]="isMember"
      >
      <span class="field-error" *ngIf="errors['memberId']">{{ errors['memberId'] }}</span>
      <span class="field-hint" *ngIf="isMember">Your member ID is auto-filled</span>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="submitting">{{ submitting ? 'Creating...' : 'Create Borrow' }}</button>
      <button type="button" class="btn btn-cancel" (click)="onCancel()">Cancel</button>
    </div>
  </form>
</div>
