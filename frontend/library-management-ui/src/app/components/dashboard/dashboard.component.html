<div class="dashboard">
  <h2>Dashboard</h2>

  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
    <button (click)="loadSummary()">Retry</button>
  </div>

  <div class="loading" *ngIf="loading">Loading dashboard...</div>

  <div class="summary-cards" *ngIf="summary && !loading">
    <div class="card">
      <div class="card-icon">📚</div>
      <div class="card-content">
        <h3>{{ summary.totalBooks }}</h3>
        <p>Total Books</p>
      </div>
    </div>

    <div class="card">
      <div class="card-icon">📋</div>
      <div class="card-content">
        <h3>{{ summary.activeBorrows }}</h3>
        <p>Active Borrows</p>
      </div>
    </div>

    <div class="card">
      <div class="card-icon">⏳</div>
      <div class="card-content">
        <h3>{{ summary.pendingReservations }}</h3>
        <p>Pending Reservations</p>
      </div>
    </div>

    <div class="card">
      <div class="card-icon">⚠️</div>
      <div class="card-content">
        <h3>{{ summary.overdueCount }}</h3>
        <p>Overdue Books</p>
      </div>
    </div>
  </div>
</div>
